<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#07030a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      GitHub Pages cannot send response headers, so the policy has to ride
      along in the document. Everything listed is a host the page genuinely
      talks to: Web3Forms for the contact form, hCaptcha for its widget,
      Google Fonts for Inter Tight and JetBrains Mono. script-src deliberately has no
      'unsafe-inline' — the build emits no inline scripts, so an injected
      <script> would not execute. style-src needs it for React's inline
      style attributes and hCaptcha's own styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://hcaptcha.com https://*.hcaptcha.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://hcaptcha.com https://*.hcaptcha.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://api.web3forms.com https://hcaptcha.com https://*.hcaptcha.com;
        frame-src https://hcaptcha.com https://*.hcaptcha.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Daniel Mehler | AI for Businesses</title>
    <meta name="description" content="AI engineer and co-founder of Oblivion. Full-stack builds, AI agents and process automation for businesses, built end to end." />
    <link rel="canonical" href="https://daniel-mehler.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daniel Mehler" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://daniel-mehler.com/" />
    <meta property="og:title" content="Daniel Mehler | AI for Businesses" />
    <meta property="og:description" content="AI engineer and co-founder of Oblivion. Full-stack builds, AI agents and process automation for businesses, built end to end." />
    <meta property="og:image" content="https://daniel-mehler.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://daniel-mehler.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Daniel Mehler in blue spotlight, with the line AI for Businesses" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
