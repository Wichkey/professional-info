<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#07030a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      GitHub Pages cannot send response headers, so the policy has to ride
      along in the document. Everything listed is a host the page genuinely
      talks to: Web3Forms for the contact form, hCaptcha for its widget,
      Google Fonts for Inter Tight and JetBrains Mono. script-src deliberately has no
      'unsafe-inline' — the build emits no inline scripts, so an injected
      <script> would not execute. style-src needs it for React's inline
      style attributes and hCaptcha's own styles.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' https://web3forms.com https://hcaptcha.com https://*.hcaptcha.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://hcaptcha.com https://*.hcaptcha.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://api.web3forms.com https://hcaptcha.com https://*.hcaptcha.com;
        frame-src https://hcaptcha.com https://*.hcaptcha.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests
      "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Daniel Mehler — AI engineer and co-founder of Oblivion. Agent systems, AI products and software for businesses, built end to end."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Daniel Mehler</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
